<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USEAS | Professional Academic Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --neon: #00f2ff; --glass: rgba(255, 255, 255, 0.08); --border: rgba(255, 255, 255, 0.1); }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
        body { background: #090a0f; color: white; min-height: 100vh; overflow-x: hidden; }
        
        #bg-canvas { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at top right, #1b2735, #090a0f); }
        .stars { position: absolute; inset: 0; background: url('https://www.transparenttextures.com/patterns/stardust.png'); opacity: 0.3; animation: move 150s linear infinite; }
        @keyframes move { from { background-position: 0 0; } to { background-position: 10000px 5000px; } }

        #admin-bar { display: none; background: #2ecc71; padding: 12px; position: sticky; top: 0; z-index: 9999; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .btn-admin { background: white; color: #000; border: none; padding: 6px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; margin: 0 5px; font-size: 0.8rem; }

        header { text-align: center; padding: 60px 20px 20px; }
        .logo { font-size: 42px; font-weight: 800; letter-spacing: 4px; text-shadow: 0 0 25px var(--neon); color: white; }
        .search-wrap { max-width: 600px; margin: 30px auto; }
        .search-wrap input { width: 100%; padding: 15px 30px; border-radius: 50px; border: 1px solid var(--border); background: rgba(0,0,0,0.6); color: white; outline: none; backdrop-filter: blur(10px); }

        .nav-header { max-width: 1200px; margin: 0 auto 25px; padding: 0 30px; display: flex; align-items: center; gap: 15px; }
        .breadcrumb { font-size: 0.85rem; color: var(--neon); text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.7; }
        .btn-back { display: none; background: var(--glass); border: 1px solid var(--neon); color: white; padding: 6px 18px; border-radius: 50px; cursor: pointer; font-size: 0.8rem; }

        .main-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; padding: 20px; max-width: 1250px; margin: 0 auto; }
        .card { background: var(--glass); border: 1px solid var(--border); padding: 50px 25px; border-radius: 28px; text-align: center; cursor: pointer; transition: 0.4s; backdrop-filter: blur(20px); position: relative; }
        .card:hover { transform: translateY(-10px); border-color: var(--neon); background: rgba(255,255,255,0.12); }
        .card i.main-icon { font-size: 3.5rem; color: var(--neon); margin-bottom: 25px; filter: drop-shadow(0 0 10px var(--neon)); }

        .admin-controls { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; z-index: 10; }
        .admin-controls i { cursor: pointer; font-size: 1.1rem; transition: 0.2s; }

        .units-panel { display: none; max-width: 900px; margin: 0 auto; padding: 20px; background: rgba(0,0,0,0.4); border-radius: 30px; border: 1px solid var(--border); }
        .unit-row { background: rgba(255,255,255,0.05); margin-bottom: 12px; padding: 18px 25px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.3s; }
        .unit-row:hover { background: rgba(255,255,255,0.1); border-color: var(--neon); }

        /* V2 LOADER STYLE */
        #v2-loader { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .v2-logo-spin { font-size: 3.5rem; color: var(--neon); margin-bottom: 25px; animation: pulse 1.5s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 20px var(--neon); } }
        .progress-bar-container { width: 250px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-top: 25px; overflow: hidden; }
        #v2-progress { width: 0%; height: 100%; background: var(--neon); transition: 0.4s linear; box-shadow: 0 0 15px var(--neon); }

        #admin-editor { display: none; margin-top: 20px; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 20px; border: 1px solid var(--neon); }
        .edit-input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid var(--border); background: #000; color: #fff; outline: none; }
        .btn-update { width: 100%; padding: 12px; background: var(--neon); color: #000; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; }

        .viewer { display: none; position: fixed; inset: 0; background: #000; z-index: 9000; flex-direction: column; }
        .v-bar { background: #111; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        iframe { width: 100%; flex-grow: 1; border: none; }

        footer { padding: 60px; text-align: center; opacity: 0.4; font-size: 0.8rem; cursor: pointer; }
    </style>
</head>
<body>

<div id="bg-canvas"><div class="stars"></div></div>

<div id="v2-loader">
    <div class="v2-logo-spin"><i class="fa-solid fa-shield-halved"></i></div>
    <div style="font-size: 1.4rem; font-weight: 600; color: var(--neon); letter-spacing: 4px;">USEAS NETWORK</div>
    <div id="v2-status" style="margin-top: 10px; font-size: 0.9rem; color: rgba(255,255,255,0.6);">Initializing Tunnel...</div>
    <div class="progress-bar-container">
        <div id="v2-progress"></div>
    </div>
</div>

<div id="admin-bar">
    🛡️ ADMIN ACTIVE | 
    <button class="btn-admin" onclick="triggerAdd()">+ ADD NEW</button>
    <button id="v2-toggle-btn" class="btn-admin" style="background:#f39c12;" onclick="toggleV2Loader()">V2 Loader: OFF</button>
    <button class="btn-admin" style="background:#ff5252; color:#fff;" onclick="location.reload()">EXIT</button>
</div>

<header>
    <div class="logo">🚀 USEAS</div>
    <div class="search-wrap"><input type="text" id="findBox" placeholder="Search portal..." onkeyup="runSearch()"></div>
</header>

<div class="nav-header">
    <button id="back-trigger" class="btn-back" onclick="navBack()">BACK</button>
    <div id="path-txt" class="breadcrumb">PORTAL / SEMESTERS</div>
</div>

<div id="card-grid" class="main-grid"></div>

<div id="units-page" class="units-panel">
    <h2 id="sub-heading" style="color:var(--neon); margin-bottom:20px; text-align:center;"></h2>
    <div id="units-stack"></div>

    <div id="admin-editor">
        <p style="color:var(--neon); font-weight:bold;">Editing: <span id="editing-unit-name"></span></p>
        <input type="text" id="edit-link" class="edit-input" placeholder="Paste URL here...">
        <div style="display:flex; gap:10px; margin-bottom:10px;">
            <button id="tabPdf" class="btn-admin" style="background:var(--neon)" onclick="switchLinkType('pdf')">PDF Link</button>
            <button id="tabVid" class="btn-admin" style="background:white" onclick="switchLinkType('vid')">Video Link</button>
        </div>
        <button class="btn-update" onclick="saveEdit()">Update Link</button>
    </div>
</div>

<div id="pdf-screen" class="viewer">
    <div class="v-bar">
        <span id="pdf-label" style="color:var(--neon); font-weight:600;"></span>
        <div style="display:flex; gap:12px;">
            <button id="fs-btn" style="display:none; background:#3498db; color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer;" onclick="goFull()"><i class="fa-solid fa-expand"></i></button>
            <button onclick="hideViewer()" style="background:#ff5252; color:white; border:none; padding:8px 22px; border-radius:8px; cursor:pointer;">Close</button>
        </div>
    </div>
    <iframe id="pdf-frame" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
</div>

<footer id="pass-trigger">© 2026 USEAS Portal | mee prayanam maa bhadyatha</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDt8SROwFORTZFqVe5xLc3nlDukbOAgdzs",
      authDomain: "useasnotes.firebaseapp.com",
      databaseURL: "https://useasnotes-default-rtdb.firebaseio.com",
      projectId: "useasnotes",
      storageBucket: "useasnotes.firebasestorage.app",
      messagingSenderId: "1066601715098",
      appId: "1:1066601715098:web:3b424d6e097d9112d09623",
      measurementId: "G-5NMMTRGSR6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, "portal", "academic_data_final");

    let dbData = {};
    let isAdmin = false;
    let mode = 'semesters'; 
    let path = { sem: null, group: null, subId: null };
    let activeEditIdx = null;
    let activeLinkType = 'pdf';
    let v2On = false;

    onSnapshot(docRef, (s) => {
        if(s.exists()) {
            dbData = s.data();
            v2On = dbData.settings?.v2Enabled || false;
            updateV2UI();
        }
        draw();
    });

    function draw() {
        const grid = document.getElementById('card-grid');
        const unitsPage = document.getElementById('units-page');
        const backBtn = document.getElementById('back-trigger');
        const pathLabel = document.getElementById('path-txt');

        grid.innerHTML = ''; grid.style.display = 'grid';
        unitsPage.style.display = 'none';
        backBtn.style.display = mode === 'semesters' ? 'none' : 'block';

        if(mode === 'semesters') {
            pathLabel.innerText = "SELECT SEMESTER";
            Object.keys(dbData).filter(k => k !== 'settings').sort().forEach(s => buildCard(s, "fa-graduation-cap", "Semester", () => { path.sem = s; mode = 'groups'; draw(); }, s));
        }
        else if(mode === 'groups') {
            pathLabel.innerText = `${path.sem} / GROUPS`;
            const groups = dbData[path.sem] || {};
            Object.keys(groups).forEach(g => buildCard(g, "fa-users-gear", "Group", () => { path.group = g; mode = 'subjects'; draw(); }, g));
        }
        else if(mode === 'subjects') {
            pathLabel.innerText = `${path.group} / SUBJECTS`;
            const subs = dbData[path.sem][path.group] || {};
            Object.keys(subs).forEach(id => buildCard(subs[id].title, "fa-book", "Subject", () => { path.subId = id; mode = 'units'; draw(); }, id));
        }
        else if(mode === 'units') {
            grid.style.display = 'none'; unitsPage.style.display = 'block';
            drawUnits();
        }
    }

    function buildCard(title, icon, type, clickFn, key) {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = clickFn;
        card.innerHTML = `
            ${isAdmin ? `
            <div class="admin-controls">
                <i class="fa-solid fa-pen-to-square" style="color:var(--neon);" onclick="event.stopPropagation(); editName('${key}', '${title}')"></i>
                <i class="fa-solid fa-trash" style="color:#ff5252;" onclick="event.stopPropagation(); removeData('${key}')"></i>
            </div>` : ''}
            <i class="fa-solid ${icon} main-icon"></i>
            <h3>${title}</h3>
            <p style="opacity:0.5; font-size:0.7rem;">${type}</p>
        `;
        document.getElementById('card-grid').appendChild(card);
    }

    function drawUnits() {
        const sub = dbData[path.sem][path.group][path.subId];
        document.getElementById('sub-heading').innerText = sub.title;
        const list = document.getElementById('units-stack');
        list.innerHTML = '';
        (sub.units || []).forEach((u, i) => {
            const row = document.createElement('div');
            row.className = 'unit-row';
            row.onclick = () => isAdmin ? openAdminEditor(i) : handleLinkClick(i);
            row.innerHTML = `
                <span>${u}</span>
                <div style="display:flex; gap:15px; align-items:center;">
                    ${(sub.vids && sub.vids[i] && sub.vids[i] !== "#") ? `<i class="fa-brands fa-youtube" style="color:red; font-size:1.3rem;" onclick="event.stopPropagation(); openVideo(${i})"></i>` : ''}
                    <i class="fa-solid fa-file-pdf" style="color:var(--neon)"></i>
                    ${isAdmin ? `<i class="fa-solid fa-circle-xmark" style="color:red;" onclick="event.stopPropagation(); deleteUnit(${i})"></i>` : ''}
                </div>`;
            list.appendChild(row);
        });
    }

    // --- Media & V2 Logic ---
    window.handleLinkClick = (i) => {
        const sub = dbData[path.sem][path.group][path.subId];
        const url = sub.links[i];
        if(!url || url === "#") return alert("No link found!");
        
        if(v2On) {
            const loader = document.getElementById('v2-loader');
            const progress = document.getElementById('v2-progress');
            const status = document.getElementById('v2-status');
            const msgs = ["Initializing Secure Tunnel...", "Verifying Signature...", "Bypassing Buffer...", "Ready!"];
            
            loader.style.display = 'flex';
            progress.style.width = '0%';
            let step = 0;
            const interval = setInterval(() => {
                status.innerText = msgs[step];
                progress.style.width = ((step + 1) * 25) + "%";
                step++;
                if(step >= msgs.length) {
                    clearInterval(interval);
                    setTimeout(() => {
                        loader.style.display = 'none';
                        window.open(url, '_blank');
                    }, 500);
                }
            }, 800);
        } else {
            openFile(url, sub.units[i]);
        }
    };

    window.openFile = (url, name) => {
        let finalUrl = url;
        if(url.includes('drive.google.com')) {
            let fileId = url.includes('/d/') ? url.split('/d/')[1].split('/')[0] : new URL(url).searchParams.get('id');
            finalUrl = `https://drive.google.com/file/d/${fileId}/preview`;
        }
        document.getElementById('pdf-label').innerText = name;
        document.getElementById('pdf-frame').src = finalUrl;
        document.getElementById('fs-btn').style.display = 'none';
        document.getElementById('pdf-screen').style.display = 'flex';
    };

    window.openVideo = (i) => {
        const sub = dbData[path.sem][path.group][path.subId];
        let url = sub.vids[i];
        let id = "";
        if(url.includes('youtu.be/')) id = url.split('youtu.be/')[1].split(/[?#]/)[0];
        else if(url.includes('watch?v=')) id = new URL(url).searchParams.get('v');
        else if(url.includes('embed/')) id = url.split('embed/')[1].split(/[?#]/)[0];

        if(!id) return alert("Invalid Video Link!");
        document.getElementById('pdf-label').innerText = sub.units[i] + " (Video)";
        document.getElementById('pdf-frame').src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
        document.getElementById('fs-btn').style.display = 'block';
        document.getElementById('pdf-screen').style.display = 'flex';
    };

    window.goFull = () => {
        const f = document.getElementById('pdf-frame');
        if(f.requestFullscreen) f.requestFullscreen();
        else if(f.webkitRequestFullscreen) f.webkitRequestFullscreen();
    };

    window.hideViewer = () => { document.getElementById('pdf-screen').style.display = 'none'; document.getElementById('pdf-frame').src = ""; };

    // --- Admin Logic ---
    window.toggleV2Loader = async () => {
        v2On = !v2On;
        dbData.settings = { v2Enabled: v2On };
        await setDoc(docRef, dbData);
        updateV2UI();
    };

    function updateV2UI() {
        const btn = document.getElementById('v2-toggle-btn');
        if(btn) {
            btn.innerText = v2On ? "V2 Loader: ON" : "V2 Loader: OFF";
            btn.style.background = v2On ? "#2ecc71" : "#f39c12";
        }
    }

    window.editName = async (key, old) => {
        const n = prompt("Enter new name:", old);
        if(!n || n === old) return;
        if(mode === 'semesters') { dbData[n] = dbData[key]; delete dbData[key]; }
        else if(mode === 'groups') { dbData[path.sem][n] = dbData[path.sem][key]; delete dbData[path.sem][key]; }
        else if(mode === 'subjects') { dbData[path.sem][path.group][key].title = n; }
        await setDoc(docRef, dbData);
    };

    window.removeData = async (key) => {
        if(!confirm("Delete this?")) return;
        if(mode === 'semesters') delete dbData[key];
        else if(mode === 'groups') delete dbData[path.sem][key];
        else if(mode === 'subjects') delete dbData[path.sem][path.group][key];
        await setDoc(docRef, dbData);
    };

    window.deleteUnit = async (idx) => {
        if(!confirm("Delete unit?")) return;
        const s = dbData[path.sem][path.group][path.subId];
        s.units.splice(idx, 1); s.links.splice(idx, 1);
        if(s.vids) s.vids.splice(idx, 1);
        await setDoc(docRef, dbData);
    };

    window.openAdminEditor = (i) => {
        activeEditIdx = i;
        document.getElementById('admin-editor').style.display = 'block';
        document.getElementById('editing-unit-name').innerText = dbData[path.sem][path.group][path.subId].units[i];
        switchLinkType('pdf');
    };

    window.switchLinkType = (t) => {
        activeLinkType = t;
        const sub = dbData[path.sem][path.group][path.subId];
        document.getElementById('tabPdf').style.background = t === 'pdf' ? 'var(--neon)' : 'white';
        document.getElementById('tabVid').style.background = t === 'vid' ? 'var(--neon)' : 'white';
        document.getElementById('edit-link').value = t === 'pdf' ? sub.links[activeEditIdx] : (sub.vids ? sub.vids[activeEditIdx] : "");
    };

    window.saveEdit = async () => {
        const sub = dbData[path.sem][path.group][path.subId];
        const val = document.getElementById('edit-link').value;
        if(activeLinkType === 'pdf') sub.links[activeEditIdx] = val;
        else { if(!sub.vids) sub.vids = new Array(sub.units.length).fill(""); sub.vids[activeEditIdx] = val; }
        await setDoc(docRef, dbData);
        alert("Saved!");
        document.getElementById('admin-editor').style.display = 'none';
    };

    window.navBack = () => {
        if(mode === 'units') mode = 'subjects';
        else if(mode === 'subjects') mode = 'groups';
        else if(mode === 'groups') mode = 'semesters';
        draw();
    };

    let clicks = 0;
    document.getElementById('pass-trigger').onclick = () => { if(++clicks === 5) { clicks = 0; if(prompt("Pass:") === "study11") { isAdmin = true; document.getElementById('admin-bar').style.display = 'block'; draw(); } } };

    window.triggerAdd = async () => {
        const val = prompt(`New ${mode.slice(0,-1).toUpperCase()} Name:`);
        if(!val) return;
        if(mode === 'semesters') dbData[val] = {};
        else if(mode === 'groups') dbData[path.sem][val] = {};
        else if(mode === 'subjects') {
            const id = "s" + Date.now();
            dbData[path.sem][path.group][id] = { title: val, units: [], links: [], vids: [] };
        }
        else if(mode === 'units') {
            const s = dbData[path.sem][path.group][path.subId];
            s.units.push(val); s.links.push("#"); if(!s.vids) s.vids = []; s.vids.push("");
        }
        await setDoc(docRef, dbData);
    };

    window.runSearch = () => {
        const q = document.getElementById('findBox').value.toLowerCase();
        document.querySelectorAll('.card, .unit-row').forEach(el => el.style.display = el.innerText.toLowerCase().includes(q) ? '' : 'none');
    };
</script>
</body>
</html>
