<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thodu – Real-time Journey</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    :root{
      --primary:#28a745;--primary-light:rgba(40,167,69,.12);
      --danger:#dc3545;--warn:#ffc107;--dark:#1a1a1a;
      --gray:#6c757d;--light-bg:#f4f6f9;--white:#fff;
      --radius:16px;--shadow:0 6px 24px rgba(0,0,0,.08);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body,html{width:100%;height:100%;font-family:'Poppins',sans-serif;background:#fff;overflow:hidden;}
    .screen{display:none;width:100%;height:100vh;position:absolute;top:0;left:0;
            flex-direction:column;align-items:center;justify-content:center;}
    .active{display:flex!important;}

    /* ── SPLASH ── */
    #splash-screen{background:linear-gradient(135deg,#fff 0%,#e8f5e9 100%);}
    .brand-wrap{text-align:center;}
    .brand-name{display:flex;justify-content:center;font-size:5rem;font-weight:900;
                font-family:'Montserrat',sans-serif;color:var(--dark);}
    .letter{display:inline-block;opacity:0;}
    .l-T{animation:fromLeft .7s forwards .6s}
    .l-H{animation:fromBot .7s forwards .8s}
    .l-O{animation:zoomIn  .7s forwards 1s}
    .l-D{animation:fadeIn  .7s forwards 1.2s}
    .l-U{animation:fromRight .7s forwards 1.4s}
    @keyframes fromLeft {from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:translateX(0)}}
    @keyframes fromBot  {from{opacity:0;transform:translateY(60px)} to{opacity:1;transform:translateY(0)}}
    @keyframes zoomIn   {from{opacity:0;transform:scale(.2)}        to{opacity:1;transform:scale(1)}}
    @keyframes fadeIn   {from{opacity:0}                            to{opacity:1}}
    @keyframes fromRight{from{opacity:0;transform:translateX(70px)} to{opacity:1;transform:translateX(0)}}
    .brand-green{color:var(--primary)!important;transition:color .5s;}
    .tagline{margin-top:14px;font-size:.95rem;color:#888;letter-spacing:.5px;opacity:0;
             animation:fadeIn .8s forwards 2.4s;}
    .splash-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);
                display:inline-block;margin:0 3px;opacity:0;}
    .dot1{animation:fadeIn .4s forwards 2s}
    .dot2{animation:fadeIn .4s forwards 2.2s}
    .dot3{animation:fadeIn .4s forwards 2.4s}

    /* ── AUTH ── */
    #login-screen{background:linear-gradient(160deg,#e8f5e9 0%,#f4f6f9 100%);}
    .auth-card{width:88%;max-width:400px;padding:36px 28px;background:#fff;
               border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.12);}
    .auth-logo{font-family:'Montserrat',sans-serif;font-size:1.8rem;font-weight:900;
               color:var(--primary);text-align:center;margin-bottom:6px;}
    .auth-sub{text-align:center;color:var(--gray);font-size:.85rem;margin-bottom:24px;}
    .auth-card h2{font-family:'Montserrat',sans-serif;margin-bottom:20px;
                  font-size:1.4rem;color:var(--dark);}
    .field-group{margin-bottom:14px;}
    .field-label{font-size:.78rem;font-weight:600;color:var(--gray);
                  text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;display:block;}
    .field-wrap{position:relative;}
    .field-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:1rem;}
    input{width:100%;padding:13px 13px 13px 40px;border:2px solid #eee;
          border-radius:13px;font-family:'Poppins',sans-serif;font-size:.92rem;
          outline:none;transition:border-color .2s,box-shadow .2s;}
    input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);}
    input.no-icon{padding-left:13px;}
    .btn{width:100%;padding:14px;border:none;border-radius:13px;font-weight:600;
         font-family:'Poppins',sans-serif;font-size:.97rem;cursor:pointer;
         transition:.25s;margin-top:6px;}
    .btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 18px rgba(40,167,69,.35);}
    .btn-primary:hover{background:#218838;transform:translateY(-1px);}
    .btn-primary:disabled{background:#aaa;box-shadow:none;cursor:not-allowed;transform:none;}
    .btn-outline{background:#fff;color:var(--danger);border:2px solid var(--danger);}
    .auth-switch{text-align:center;margin-top:18px;color:var(--gray);font-size:.87rem;}
    .link{color:var(--primary);cursor:pointer;font-weight:600;}
    .link:hover{text-decoration:underline;}

    /* ── HOME ── */
    #home-screen{justify-content:flex-start;background:var(--light-bg);padding:0;}
    .home-body{flex:1;width:100%;overflow-y:auto;padding:16px 16px 88px;}
    .top-bar{width:100%;background:#fff;padding:14px 18px;
             display:flex;align-items:center;justify-content:space-between;
             box-shadow:0 2px 12px rgba(0,0,0,.07);position:sticky;top:0;z-index:50;}
    .top-bar-brand{font-family:'Montserrat',sans-serif;font-weight:900;
                    font-size:1.3rem;color:var(--primary);}
    .loc-chip{display:flex;align-items:center;gap:6px;background:var(--light-bg);
              padding:7px 12px;border-radius:20px;font-size:.8rem;color:var(--dark);
              font-weight:500;cursor:pointer;max-width:200px;overflow:hidden;
              white-space:nowrap;text-overflow:ellipsis;}

    /* search */
    .search-bar{background:#fff;border-radius:14px;padding:10px 14px;
                display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);
                margin-bottom:16px;border:2px solid #eee;}
    .search-bar input{border:none;box-shadow:none;padding:0;font-size:.9rem;
                      background:transparent;flex:1;}
    .search-bar input:focus{border:none;box-shadow:none;}

    /* section */
    .sec-header{display:flex;align-items:center;justify-content:space-between;
                margin-bottom:12px;}
    .sec-title{font-family:'Montserrat',sans-serif;font-size:1.15rem;
                font-weight:700;color:var(--dark);}
    .sec-count{background:var(--primary-light);color:var(--primary);
                padding:3px 10px;border-radius:20px;font-size:.78rem;font-weight:700;}

    /* ride card */
    .ride-card{background:#fff;border-radius:var(--radius);padding:16px;
                margin-bottom:12px;box-shadow:var(--shadow);
                border-left:4px solid var(--primary);transition:.2s;cursor:pointer;}
    .ride-card:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.1);}
    .ride-route{font-weight:700;font-size:.98rem;color:var(--dark);margin-bottom:8px;
                display:flex;align-items:center;gap:6px;}
    .ride-arrow{color:var(--primary);font-weight:900;}
    .ride-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
    .pill{background:var(--light-bg);padding:4px 10px;border-radius:20px;
          font-size:.76rem;font-weight:600;color:var(--gray);}
    .pill.g{background:var(--primary-light);color:var(--primary);}
    .pill.b{background:#e8f4fd;color:#0d6efd;}
    .pill.y{background:#fff3cd;color:#856404;}
    .ride-footer{display:flex;align-items:center;justify-content:space-between;}
    .price-tag{font-size:1.1rem;font-weight:700;color:var(--primary);}
    .book-btn{padding:8px 18px;background:var(--primary);color:#fff;border:none;
              border-radius:10px;font-family:'Poppins',sans-serif;font-weight:600;
              font-size:.82rem;cursor:pointer;transition:.2s;}
    .book-btn:hover{background:#218838;}
    .book-btn:disabled{background:#ccc;cursor:not-allowed;}

    /* profile */
    .profile-top{text-align:center;padding:28px 0 20px;}
    .avatar{width:80px;height:80px;border-radius:50%;background:var(--primary);
            display:flex;align-items:center;justify-content:center;
            font-size:2rem;font-weight:700;color:#fff;margin:0 auto 12px;
            box-shadow:0 4px 16px rgba(40,167,69,.35);}
    .p-name{font-size:1.25rem;font-weight:700;color:var(--dark);}
    .p-email{color:var(--gray);font-size:.83rem;margin-top:3px;}
    .verified-badge{display:inline-flex;align-items:center;gap:5px;
                    background:var(--primary-light);color:var(--primary);
                    padding:5px 14px;border-radius:20px;font-size:.8rem;
                    font-weight:700;margin-top:10px;}
    .doc-section-label{font-size:.78rem;font-weight:700;color:var(--gray);
                       text-transform:uppercase;letter-spacing:.5px;
                       margin-bottom:10px;margin-top:4px;}
    .doc-card{background:#fff;border-radius:var(--radius);padding:16px;
              margin-bottom:12px;box-shadow:var(--shadow);display:flex;
              align-items:center;gap:12px;cursor:pointer;transition:.2s;
              border:2px dashed #e0e0e0;}
    .doc-card:hover{border-color:var(--primary);transform:translateY(-1px);}
    .doc-card.st-pending{border:2px solid var(--warn);}
    .doc-card.st-verified{border:2px solid var(--primary);border-style:solid;}
    .doc-card.st-rejected{border:2px solid var(--danger);}
    .doc-icon-box{width:46px;height:46px;border-radius:12px;background:var(--light-bg);
                  display:flex;align-items:center;justify-content:center;
                  font-size:1.4rem;flex-shrink:0;}
    .doc-info{flex:1;min-width:0;}
    .doc-title{font-weight:600;font-size:.93rem;color:var(--dark);}
    .doc-sub{font-size:.78rem;color:var(--gray);margin-top:2px;}
    .doc-badge{padding:3px 10px;border-radius:20px;font-size:.7rem;
               font-weight:700;text-transform:uppercase;white-space:nowrap;flex-shrink:0;}
    .db-none{background:#f0f0f0;color:var(--gray);}
    .db-pending{background:#fff3cd;color:#856404;}
    .db-verified{background:#d1e7dd;color:#0a3622;}
    .db-rejected{background:#f8d7da;color:#842029;}

    /* ── ADD RIDE ── */
    #add-ride-screen{justify-content:flex-start;background:var(--light-bg);overflow-y:auto;}
    .ar-header{width:100%;background:#fff;padding:16px 18px;display:flex;
               align-items:center;gap:14px;box-shadow:0 2px 10px rgba(0,0,0,.07);
               position:sticky;top:0;z-index:10;flex-shrink:0;}
    .back-btn{width:38px;height:38px;border-radius:50%;background:var(--light-bg);
              border:none;font-size:1.1rem;cursor:pointer;display:flex;
              align-items:center;justify-content:center;transition:.2s;}
    .back-btn:hover{background:#e0e0e0;}
    .ar-title{font-family:'Montserrat',sans-serif;font-size:1.2rem;font-weight:900;}
    .ar-body{width:100%;padding:18px;padding-bottom:40px;}
    .form-card{background:#fff;border-radius:var(--radius);padding:18px;
               margin-bottom:16px;box-shadow:var(--shadow);}
    .form-label{font-size:.78rem;font-weight:700;color:var(--gray);
                text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;display:block;}
    .veh-grid{display:flex;gap:10px;}
    .veh-btn{flex:1;padding:14px 6px;border:2px solid #eee;border-radius:14px;
             background:#fff;cursor:pointer;text-align:center;transition:.2s;
             font-family:'Poppins',sans-serif;}
    .veh-btn.sel{border-color:var(--primary);background:var(--primary-light);}
    .veh-btn.sel .veh-label{color:var(--primary);}
    #ride-map{width:100%;height:260px;border-radius:var(--radius);overflow:hidden;z-index:1;}
    .submit-btn{width:100%;padding:16px;background:var(--primary);color:#fff;
                border:none;border-radius:14px;font-family:'Poppins',sans-serif;
                font-size:1rem;font-weight:700;cursor:pointer;margin-top:8px;
                box-shadow:0 4px 16px rgba(40,167,69,.35);transition:.2s;}

    /* ── MODAL ── */
    .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;
                   background:rgba(0,0,0,.6);display:none;align-items:center;
                   justify-content:center;z-index:9999;padding:20px;}
    .modal-box{background:#fff;border-radius:24px;padding:28px;
                max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2);
                animation:zoomIn .25s ease;}
    .modal-box h3{font-family:'Montserrat',sans-serif;margin-bottom:15px;font-size:1.2rem;}
    .modal-actions{display:flex;gap:10px;margin-top:20px;}
    .modal-actions button{flex:1;padding:12px;border-radius:12px;border:none;
                          font-family:'Poppins',sans-serif;font-weight:600;cursor:pointer;}
    .m-primary{background:var(--primary);color:#fff;}
    .m-secondary{background:#f0f0f0;color:var(--dark);}

    /* ── ADMIN ── */
    #admin-screen{justify-content:flex-start;background:var(--light-bg);overflow-y:auto;}
    .admin-user-card{background:#fff;border-radius:var(--radius);padding:16px;
                      margin-bottom:14px;box-shadow:var(--shadow);}
    .admin-doc-details{background:var(--light-bg);padding:12px;border-radius:12px;margin-bottom:10px;font-size:.85rem;}

    /* ── BOTTOM NAV ── */
    .bottom-nav{width:100%;height:70px;background:#fff;border-top:1px solid #eee;
                display:flex;position:fixed;bottom:0;z-index:100;
                box-shadow:0 -4px 20px rgba(0,0,0,.06);}
    .nav-item{flex:1;display:flex;flex-direction:column;justify-content:center;
              align-items:center;color:#ccc;cursor:pointer;font-size:.74rem;
              transition:color .2s;gap:2px;}
    .nav-active{color:var(--primary);font-weight:600;}

    /* ── FAB ── */
    #fab-btn{position:fixed;bottom:86px;right:18px;width:56px;height:56px;
              border-radius:50%;background:var(--primary);color:#fff;border:none;
              font-size:1.8rem;box-shadow:0 6px 22px rgba(40,167,69,.45);
              cursor:pointer;z-index:200;display:none;align-items:center;
              justify-content:center;}

    #toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
            background:rgba(26,26,26,.92);color:#fff;padding:11px 22px;
            border-radius:30px;font-size:.86rem;z-index:9998;opacity:0;transition:opacity .3s;pointer-events:none;}
    #toast.show{opacity:1;}
    .empty-state{text-align:center;padding:50px 20px;color:var(--gray);}
  </style>
</head>
<body>

<div id="splash-screen" class="screen active">
  <div class="brand-wrap">
    <div class="brand-name">
      <span class="letter l-T">T</span>
      <span class="letter l-H">H</span>
      <span class="letter l-O">O</span>
      <span class="letter l-D">D</span>
      <span class="letter l-U">U</span>
    </div>
    <div>
      <span class="splash-dot dot1">●</span>
      <span class="splash-dot dot2">●</span>
      <span class="splash-dot dot3">●</span>
    </div>
    <p class="tagline">mee prayanam maa bhadyatha</p>
  </div>
</div>

<div id="login-screen" class="screen">
  <div class="auth-card" id="auth-container"></div>
</div>

<div id="home-screen" class="screen">
  <div class="top-bar">
    <span class="top-bar-brand">THODU</span>
    <div class="loc-chip" onclick="getMyLocation()">
      📍 <span id="loc-text">Getting location…</span>
    </div>
  </div>
  <div class="home-body" id="home-body"></div>
  <button id="fab-btn" onclick="handleFABClick()">＋</button>
  <nav class="bottom-nav" id="bottom-nav">
    <div class="nav-item nav-active" id="nav-rides" onclick="switchTab('rides',this)">
      <span>🚗</span><span>Rides</span>
    </div>
    <div class="nav-item" id="nav-my-rides" onclick="switchTab('my-rides',this)">
      <span>📋</span><span>My Rides</span>
    </div>
    <div class="nav-item" id="nav-profile" onclick="switchTab('profile',this)">
      <span>👤</span><span>Profile</span>
    </div>
    <div class="nav-item" id="nav-admin" style="display:none;" onclick="switchTab('admin',this)">
      <span>🛡️</span><span>Admin</span>
    </div>
  </nav>
</div>

<div id="add-ride-screen" class="screen">
  <div class="ar-header">
    <button class="back-btn" onclick="goHome()">←</button>
    <span class="ar-title">Add a Ride</span>
  </div>
  <div class="ar-body">
    <div class="form-card">
      <label class="form-label">📍 Route</label>
      <input type="text" id="from-input" placeholder="From" style="margin-bottom:10px; padding-left:13px;"/>
      <input type="text" id="to-input" placeholder="To" style="padding-left:13px;"/>
    </div>
    <div class="form-card">
       <div style="display:flex; gap:10px;">
          <input type="date" id="ride-date" class="no-icon" style="flex:1; padding:13px;"/>
          <input type="time" id="ride-time" class="no-icon" style="flex:1; padding:13px;"/>
       </div>
    </div>
    <div class="form-card">
      <label class="form-label">🚘 Vehicle</label>
      <div class="veh-grid">
        <button class="veh-btn" id="veh-bike" onclick="selectVehicle('bike',this)">🏍️ Bike</button>
        <button class="veh-btn" id="veh-auto" onclick="selectVehicle('auto',this)">🛺 Auto</button>
        <button class="veh-btn" id="veh-car" onclick="selectVehicle('car',this)">🚗 Car</button>
      </div>
    </div>
    <div class="form-card">
      <label class="form-label">💰 Price & 🪑 Seats</label>
      <div style="display:flex; gap:10px;">
          <input type="number" id="ride-price" placeholder="Price ₹" style="flex:1; padding-left:13px;"/>
          <input type="number" id="ride-seats" placeholder="Seats" style="flex:1; padding-left:13px;"/>
      </div>
    </div>
    <div class="form-card">
      <div id="ride-map"></div>
    </div>
    <button class="submit-btn" id="submit-ride-btn" onclick="submitRide()">🚀 Post Ride</button>
  </div>
</div>

<div id="admin-screen" class="screen">
  <div class="ar-header">
    <button class="back-btn" onclick="goHome()">←</button>
    <span class="ar-title">🛡️ Admin Panel</span>
  </div>
  <div class="ar-body" id="admin-body"></div>
</div>

<div id="lic-modal" class="modal-overlay">
  <div class="modal-box">
    <h3>🪪 Licence Verification</h3>
    <div class="field-group">
      <label class="field-label">DL Number</label>
      <input type="text" id="m-dl-num" class="no-icon" placeholder="TS 09 XXXX XXXX"/>
    </div>
    <div class="field-group">
      <label class="field-label">Expiry Date</label>
      <input type="date" id="m-dl-exp" class="no-icon"/>
    </div>
    <div class="field-group">
      <label class="field-label">Name (as on DL)</label>
      <input type="text" id="m-dl-name" class="no-icon" placeholder="Full Name"/>
    </div>
    <div class="modal-actions">
      <button class="m-secondary" onclick="closeModal('lic-modal')">Cancel</button>
      <button class="m-primary" onclick="submitVerification('license')">Submit</button>
    </div>
  </div>
</div>

<div id="aad-modal" class="modal-overlay">
  <div class="modal-box">
    <h3>🪪 Aadhaar Verification</h3>
    <div class="field-group">
      <label class="field-label">Aadhaar Number</label>
      <input type="number" id="m-aad-num" class="no-icon" placeholder="12 Digit Number"/>
    </div>
    <div class="field-group">
      <label class="field-label">Linked Phone No</label>
      <input type="tel" id="m-aad-phone" class="no-icon" placeholder="+91"/>
    </div>
    <div class="field-group">
      <label class="field-label">Name (as on Aadhaar)</label>
      <input type="text" id="m-aad-name" class="no-icon" placeholder="Full Name"/>
    </div>
    <div class="field-group">
      <label class="field-label">Date of Birth</label>
      <input type="date" id="m-aad-dob" class="no-icon"/>
    </div>
    <div class="modal-actions">
      <button class="m-secondary" onclick="closeModal('aad-modal')">Cancel</button>
      <button class="m-primary" onclick="submitVerification('aadhaar')">Submit</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, updateProfile, onAuthStateChanged, signOut, reload } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, onSnapshot, addDoc, getDocs, serverTimestamp, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyA1QeDf1E_Kb1ZC15ahw1dY8hk3J0gXopY",
  authDomain: "thodu-65cb9.firebaseapp.com",
  projectId: "thodu-65cb9",
  storageBucket: "thodu-65cb9.firebasestorage.app",
  messagingSenderId: "1070229943496",
  appId: "1:1070229943496:web:038e2e74c463e7acefa1fd"
});
const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_EMAIL = "admin@thodu.com";
let currentUser = null;
let userData = null;
let activeTab = 'rides';
let userUnsub = null;
let mapInstance = null;
let startPoint = null;
let endPoint = null;
let selectedVehicle = null;

/* ════════════════════ UTILS ════════════════════ */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

window.closeModal = (id) => document.getElementById(id).style.display = 'none';

/* ════════════════════ AUTH ════════════════════ */
window.setAuthState = (state) => {
  const c = document.getElementById('auth-container');
  if (state === 'login') {
    c.innerHTML = `
      <div class="auth-logo">THODU</div>
      <h2>Login</h2>
      <div class="field-group"><input type="email" id="le" placeholder="Email"/></div>
      <div class="field-group"><input type="password" id="lp" placeholder="Password"/></div>
      <button class="btn btn-primary" onclick="doLogin()">Login</button>
      <p class="auth-switch">New? <span class="link" onclick="setAuthState('signup')">Sign Up</span></p>`;
  } else if (state === 'signup') {
    c.innerHTML = `
      <div class="auth-logo">THODU</div>
      <h2>Sign Up</h2>
      <div class="field-group"><input type="text" id="sn" placeholder="Full Name"/></div>
      <div class="field-group"><input type="email" id="se" placeholder="Email"/></div>
      <div class="field-group"><input type="password" id="spw" placeholder="Password"/></div>
      <button class="btn btn-primary" onclick="doSignup()">Create Account</button>
      <p class="auth-switch"><span class="link" onclick="setAuthState('login')">Back to Login</span></p>`;
  }
};

window.doSignup = async () => {
  const name = document.getElementById('sn').value;
  const email = document.getElementById('se').value;
  const pass = document.getElementById('spw').value;
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: name });
    await setDoc(doc(db, 'users', cred.user.uid), {
      name, email, licenseStatus: 'none', aadhaarStatus: 'none'
    });
    showToast("Account Created! Please login.");
    setAuthState('login');
  } catch (e) { showToast(e.message); }
};

window.doLogin = async () => {
  const email = document.getElementById('le').value;
  const pass = document.getElementById('lp').value;
  try { await signInWithEmailAndPassword(auth, email, pass); } 
  catch (e) { showToast(e.message); }
};

window.handleLogout = () => { signOut(auth); location.reload(); };

/* ════════════════════ CORE LOGIC ════════════════════ */
onAuthStateChanged(auth, user => {
  if (user) {
    currentUser = user;
    showScreen('home-screen');
    document.getElementById('fab-btn').style.display = 'flex';
    if (user.email === ADMIN_EMAIL) document.getElementById('nav-admin').style.display = 'flex';
    startUserListener(user.uid);
    switchTab('rides', document.getElementById('nav-rides'));
  } else {
    showScreen('login-screen');
    setAuthState('login');
  }
});

function startUserListener(uid) {
  userUnsub = onSnapshot(doc(db, 'users', uid), snap => {
    userData = snap.data();
    if (activeTab === 'profile') renderProfile();
  });
}

window.switchTab = (tab, el) => {
  activeTab = tab;
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('nav-active'));
  el.classList.add('nav-active');
  const body = document.getElementById('home-body');
  document.getElementById('fab-btn').style.display = (tab === 'rides') ? 'flex' : 'none';
  
  if (tab === 'rides') renderRides();
  else if (tab === 'profile') renderProfile();
  else if (tab === 'admin') { showScreen('admin-screen'); loadAdminData(); }
};

/* ════════════════════ PROFILE & VERIFY ════════════════════ */
function renderProfile() {
  const ud = userData || {};
  const body = document.getElementById('home-body');
  body.innerHTML = `
    <div class="profile-top">
      <div class="avatar">${(currentUser.displayName||'U')[0]}</div>
      <div class="p-name">${currentUser.displayName}</div>
      <div class="p-email">${currentUser.email}</div>
    </div>
    <p class="doc-section-label">Verification</p>
    <div class="doc-card st-${ud.licenseStatus}" onclick="openVerify('license')">
      <div class="doc-icon-box">🪪</div>
      <div class="doc-info">
        <div class="doc-title">Driving Licence</div>
        <div class="doc-sub">${ud.licenseStatus === 'verified' ? 'Verified' : 'Click to update details'}</div>
      </div>
      <span class="doc-badge db-${ud.licenseStatus}">${ud.licenseStatus}</span>
    </div>
    <div class="doc-card st-${ud.aadhaarStatus}" onclick="openVerify('aadhaar')">
      <div class="doc-icon-box">🆔</div>
      <div class="doc-info">
        <div class="doc-title">Aadhaar Card</div>
        <div class="doc-sub">${ud.aadhaarStatus === 'verified' ? 'Verified' : 'Click to update details'}</div>
      </div>
      <span class="doc-badge db-${ud.aadhaarStatus}">${ud.aadhaarStatus}</span>
    </div>
    <button class="btn btn-outline" style="margin-top:20px;" onclick="handleLogout()">Logout</button>
  `;
}

window.openVerify = (type) => {
  if (userData[type+'Status'] === 'verified') return showToast("Already Verified!");
  document.getElementById(type === 'license' ? 'lic-modal' : 'aad-modal').style.display = 'flex';
};

window.submitVerification = async (type) => {
  const uid = currentUser.uid;
  let data = {};
  if (type === 'license') {
    data = {
      licenseNum: document.getElementById('m-dl-num').value,
      licenseExp: document.getElementById('m-dl-exp').value,
      licenseName: document.getElementById('m-dl-name').value,
      licenseStatus: 'pending'
    };
  } else {
    data = {
      aadhaarNum: document.getElementById('m-aad-num').value,
      aadhaarPhone: document.getElementById('m-aad-phone').value,
      aadhaarName: document.getElementById('m-aad-name').value,
      aadhaarDob: document.getElementById('m-aad-dob').value,
      aadhaarStatus: 'pending'
    };
  }
  await updateDoc(doc(db, 'users', uid), data);
  closeModal(type === 'license' ? 'lic-modal' : 'aad-modal');
  showToast("Details Submitted! Pending Admin Approval.");
};

/* ════════════════════ RIDES ════════════════════ */
window.handleFABClick = () => {
  if (userData.licenseStatus === 'verified' && userData.aadhaarStatus === 'verified') {
    showScreen('add-ride-screen');
    setTimeout(initMap, 500);
  } else {
    showToast("❌ Complete both verifications to post a ride!");
    switchTab('profile', document.getElementById('nav-profile'));
  }
};

function initMap() {
  if (mapInstance) return;
  mapInstance = L.map('ride-map').setView([17.385, 78.4867], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapInstance);
}

window.selectVehicle = (v, el) => {
    selectedVehicle = v;
    document.querySelectorAll('.veh-btn').forEach(b => b.classList.remove('sel'));
    el.classList.add('sel');
};

window.submitRide = async () => {
    const ride = {
        from: document.getElementById('from-input').value,
        to: document.getElementById('to-input').value,
        price: document.getElementById('ride-price').value,
        seats: document.getElementById('ride-seats').value,
        vehicle: selectedVehicle,
        userId: currentUser.uid,
        userName: currentUser.displayName,
        status: 'active'
    };
    await addDoc(collection(db, 'rides'), ride);
    showToast("Ride Posted!");
    goHome();
};

window.goHome = () => showScreen('home-screen');

async function renderRides() {
    const body = document.getElementById('home-body');
    body.innerHTML = `<div class="empty-state">Loading Rides...</div>`;
    const snap = await getDocs(collection(db, 'rides'));
    let html = '<div class="sec-header"><span class="sec-title">Available Rides</span></div>';
    snap.forEach(d => {
        const r = d.data();
        html += `
            <div class="ride-card">
                <div class="ride-route">🟢 ${r.from} → 🔴 ${r.to}</div>
                <div class="ride-meta">
                    <span class="pill">${r.vehicle}</span>
                    <span class="pill">🪑 ${r.seats}</span>
                    <span class="pill g">👤 ${r.userName}</span>
                </div>
                <div class="price-tag">₹${r.price}</div>
            </div>`;
    });
    body.innerHTML = html || `<div class="empty-state">No rides found.</div>`;
}

/* ════════════════════ ADMIN PANEL ════════════════════ */
async function loadAdminData() {
  const body = document.getElementById('admin-body');
  body.innerHTML = "Loading...";
  const snap = await getDocs(collection(db, 'users'));
  let html = "";
  snap.forEach(d => {
    const u = d.data();
    if (u.licenseStatus === 'pending' || u.aadhaarStatus === 'pending') {
      html += `
        <div class="admin-user-card">
          <strong>${u.name}</strong> (${u.email})
          ${u.licenseStatus === 'pending' ? `
            <div class="admin-doc-details">
              <b>Licence:</b> ${u.licenseNum} | Exp: ${u.licenseExp} | Name: ${u.licenseName}
              <div style="margin-top:5px;">
                <button class="btn btn-primary" style="width:auto; padding:5px 10px;" onclick="adminAction('${d.id}','license','verified')">Approve</button>
                <button class="btn btn-outline" style="width:auto; padding:5px 10px; color:red; border-color:red;" onclick="adminAction('${d.id}','license','rejected')">Reject</button>
              </div>
            </div>` : ''}
          ${u.aadhaarStatus === 'pending' ? `
            <div class="admin-doc-details">
              <b>Aadhaar:</b> ${u.aadhaarNum} | Phone: ${u.aadhaarPhone} | Name: ${u.aadhaarName}
              <div style="margin-top:5px;">
                <button class="btn btn-primary" style="width:auto; padding:5px 10px;" onclick="adminAction('${d.id}','aadhaar','verified')">Approve</button>
                <button class="btn btn-outline" style="width:auto; padding:5px 10px; color:red; border-color:red;" onclick="adminAction('${d.id}','aadhaar','rejected')">Reject</button>
              </div>
            </div>` : ''}
        </div>`;
    }
  });
  body.innerHTML = html || "No pending requests.";
}

window.adminAction = async (uid, type, status) => {
  await updateDoc(doc(db, 'users', uid), { [type+'Status']: status });
  showToast("Updated!");
  loadAdminData();
};

/* Splash logic */
setTimeout(() => document.querySelectorAll('.letter').forEach(l => l.classList.add('brand-green')), 2000);
</script>
</body>
</html>
