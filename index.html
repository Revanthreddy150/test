<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hub | Premium Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --neon: #00f2ff; --glass: rgba(255, 255, 255, 0.07); --border: rgba(255, 255, 255, 0.1); }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
        body { background: #050608; color: white; min-height: 100vh; overflow-x: hidden; }
        
        .bg-mesh { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
            background: radial-gradient(circle at 15% 15%, rgba(0, 242, 255, 0.1), transparent 45%),
                        radial-gradient(circle at 85% 85%, rgba(0, 114, 255, 0.1), transparent 45%);
        }

        #admin-bar { display: none; background: #1e272e; padding: 12px; position: sticky; top: 0; z-index: 2000; border-bottom: 2px solid #2ecc71; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .admin-btn { background: #2ecc71; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; margin: 0 5px; font-size: 0.8rem; }
        
        .edit-panel { background: rgba(46, 204, 113, 0.1); border: 1px dashed #2ecc71; padding: 25px; border-radius: 15px; margin-top: 25px; display: none; backdrop-filter: blur(10px); }
        .edit-input { width: 100%; padding: 12px; margin: 10px 0; background: rgba(0,0,0,0.6); border: 1px solid #2ecc71; color: #fff; border-radius: 8px; outline: none; }

        .header { text-align: center; padding: 70px 20px 20px; }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 2.5rem; letter-spacing: 5px; color: var(--neon); text-shadow: 0 0 20px rgba(0,242,255,0.6); }

        .bc-box { max-width: 1000px; margin: 15px auto; padding: 15px 25px; background: var(--glass); border-radius: 15px; border: 1px solid var(--border); font-size: 0.85rem; display: flex; gap: 10px; align-items: center; }
        .bc-link { color: var(--neon); cursor: pointer; opacity: 0.8; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 25px; padding: 25px; max-width: 1100px; margin: 0 auto; }
        .card { background: var(--glass); border: 1px solid var(--border); padding: 45px 20px; border-radius: 20px; text-align: center; cursor: pointer; position: relative; transition: 0.4s; }
        .card:hover { border-color: var(--neon); transform: translateY(-8px); background: rgba(0, 242, 255, 0.08); }
        .card i { font-size: 3rem; color: var(--neon); margin-bottom: 20px; filter: drop-shadow(0 0 10px var(--neon)); }
        
        /* Edit Buttons on Cards */
        .admin-controls { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 5px; }
        .ctrl-btn { font-size: 0.7rem; padding: 4px 8px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }

        .notes-view { display: none; max-width: 850px; margin: 30px auto; padding: 0 20px; }
        .unit-item { background: var(--glass); border: 1px solid var(--border); margin: 12px 0; padding: 18px 25px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .unit-item:hover { border-color: var(--neon); background: rgba(255,255,255,0.1); }
        .unit-actions { display: flex; gap: 20px; align-items: center; font-size: 1.3rem; }

        #v2-loader, #viewer, #video-viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; background: #050608; flex-direction: column; }
        .v-header { background: #111; padding: 18px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        iframe { width: 100%; height: 100%; border: none; }

        #toast-container { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 10000; }
        .toast { background: var(--neon); color: #000; padding: 12px 35px; border-radius: 50px; font-weight: bold; animation: slideUp 0.4s; }
        @keyframes slideUp { from { transform: translateY(100px); } }

        footer { padding: 80px; text-align: center; opacity: 0.4; font-size: 0.8rem; cursor: pointer; }
    </style>
</head>
<body>

<div class="bg-mesh"></div>
<div id="toast-container"></div>

<div id="admin-bar">
    <span style="color:#2ecc71; font-weight:bold; margin-right:15px;">🛡️ ADMIN ACTIVE</span>
    <button class="admin-btn" onclick="addNewNode()">+ Add Category</button>
    <button id="v2-toggle" class="admin-btn" style="background:#f39c12;" onclick="toggleV2()">V2 LOADER: OFF</button>
    <button class="admin-btn" style="background:#e74c3c;" onclick="location.reload()">Exit</button>
</div>

<div id="v2-loader" style="justify-content:center; align-items:center;">
    <div style="width:70px; height:70px; border:4px solid rgba(0,242,255,0.1); border-top-color:var(--neon); border-radius:50%; animation: spin 0.8s linear infinite;"></div>
    <h2 style="margin-top:25px; font-family:'Orbitron'; color:var(--neon);">SECURE CONNECTION</h2>
</div>

<div id="viewer">
    <div class="v-header">
        <span id="v-name" style="color:var(--neon); font-weight:bold;">Document</span>
        <div style="display:flex; gap:12px;">
            <button class="admin-btn" id="v-dl" style="background:#27ae60;">Download</button>
            <button class="admin-btn" style="background:#e74c3c;" onclick="closeViewer()">Close</button>
        </div>
    </div>
    <iframe id="v-frame"></iframe>
</div>

<div id="video-viewer">
    <div class="v-header">
        <span id="video-name" style="color:var(--neon); font-weight:bold;">Video Lesson</span>
        <button class="admin-btn" style="background:#e74c3c;" onclick="closeVideo()">Close</button>
    </div>
    <iframe id="video-frame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
</div>

<div class="header">
    <h1 class="logo">STUDY HUB</h1>
    <p style="opacity:0.5; font-size:0.75rem; letter-spacing:4px; margin-top:8px; text-transform:uppercase;">Mee Prayanam Maa Bhadyatha</p>
</div>

<div class="bc-box" id="bc"><span class="bc-link" onclick="resetPath()">Home</span></div>
<div class="grid" id="mainGrid"></div>

<div class="notes-view" id="notesArea">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
        <h2 id="viewTitle" style="color:var(--neon); font-family:'Orbitron';">Subject Details</h2>
        <button class="admin-btn" style="background:rgba(255,255,255,0.1);" onclick="goBack()">← Back</button>
    </div>
    <div id="unitList"></div>

    <div class="edit-panel" id="editPanel">
        <h3 style="color:#2ecc71; margin-bottom:15px;">Edit Unit Data</h3>
        <input type="text" id="editName" class="edit-input" placeholder="Unit Name">
        <input type="text" id="editPdf" class="edit-input" placeholder="PDF Link">
        <input type="text" id="editVid" class="edit-input" placeholder="YouTube Link">
        <div style="display:flex; gap:10px;">
            <button class="admin-btn" style="flex:2;" onclick="saveEdit()">Save Changes</button>
            <button class="admin-btn" style="background:#e74c3c; flex:1;" onclick="deleteUnit()">Delete Unit</button>
        </div>
    </div>
</div>

<footer id="adminTrigger">© 2026 STUDY HUB | Developed by Revanth & Sandeep</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // YOUR FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyDt8SROwFORTZFqVe5xLc3nlDukbOAgdzs",
        authDomain: "useasnotes.firebaseapp.com",
        databaseURL: "https://useasnotes-default-rtdb.firebaseio.com",
        projectId: "useasnotes",
        storageBucket: "useasnotes.firebasestorage.app",
        messagingSenderId: "1066601715098",
        appId: "1:1066601715098:web:3b424d6e097d9112d09623",
        measurementId: "G-5NMMTRGSR6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    // PATH UNIFIED TO final_v4_data TO ENSURE PREVIOUS DATA IS LOADED
    const docRef = doc(db, "portal", "final_v4_data");

    let core = {};
    let path = [];
    let isAdmin = false;
    let v2 = false;
    let selectedUnitIdx = null;

    onSnapshot(docRef, (s) => {
        if(s.exists()) {
            core = s.data();
            v2 = core._config?.v2 || false;
            updateV2UI();
            const urlParams = new URLSearchParams(window.location.search);
            const sharedPath = urlParams.get('path');
            const sharedUnit = urlParams.get('unit');
            if(sharedPath && path.length === 0) {
                path = sharedPath.split(',');
                render();
                if(sharedUnit !== null) setTimeout(() => handleUnitClick(parseInt(sharedUnit)), 800);
            } else { render(); }
        }
    });

    function render() {
        const grid = document.getElementById('mainGrid');
        const notes = document.getElementById('notesArea');
        const bc = document.getElementById('bc');
        grid.innerHTML = ''; notes.style.display = 'none'; grid.style.display = 'grid';
        bc.innerHTML = `<span class="bc-link" onclick="resetPath()">Home</span>`;
        path.forEach((p, i) => { bc.innerHTML += ` > <span class="bc-link" onclick="jumpTo(${i})">${p}</span>`; });

        let target = core;
        path.forEach(p => target = target[p]);
        if(target?._type === 'subject') { renderUnits(target); return; }

        Object.keys(target || {}).filter(k => !k.startsWith('_')).sort().forEach(k => {
            grid.innerHTML += `<div class="card" onclick="moveIn('${k}')">
                <i class="fa-solid ${path.length===0?'fa-graduation-cap':path.length===1?'fa-users-rectangle':'fa-book-open'}"></i>
                <h3>${k}</h3>
                ${isAdmin ? `
                    <div class="admin-controls">
                        <button class="ctrl-btn" style="background:#f39c12; color:white;" onclick="event.stopPropagation(); renameNode('${k}')">Edit</button>
                        <button class="ctrl-btn" style="background:#e74c3c; color:white;" onclick="event.stopPropagation(); deleteNode('${k}')">Del</button>
                    </div>` : ''}
            </div>`;
        });
    }

    function renderUnits(data) {
        document.getElementById('mainGrid').style.display = 'none';
        document.getElementById('notesArea').style.display = 'block';
        document.getElementById('viewTitle').innerText = path[path.length - 1];
        const list = document.getElementById('unitList');
        list.innerHTML = '';

        (data.units || []).forEach((u, i) => {
            const hasVid = data.vids && data.vids[i] && data.vids[i].trim() !== "";
            list.innerHTML += `
                <div class="unit-item" onclick="handleUnitClick(${i})">
                    <div style="display:flex; align-items:center; gap:15px;">
                        <i class="fa-solid fa-file-pdf" style="color:#ff5252;"></i>
                        <span>${u}</span>
                    </div>
                    <div class="unit-actions">
                        <i class="fa-solid fa-share-nodes" style="color:var(--neon);" onclick="event.stopPropagation(); shareUnit(${i})"></i>
                        ${hasVid ? `<i class="fa-brands fa-youtube" style="color:#ff0000;" onclick="event.stopPropagation(); playVideo(${i})"></i>` : ''}
                    </div>
                </div>`;
        });
        if(isAdmin) list.innerHTML += `<button class="admin-btn" style="width:100%; margin-top:20px;" onclick="addUnitPrompt()">+ Add Unit</button>`;
    }

    window.handleUnitClick = (idx) => {
        let target = core; path.forEach(p => target = target[p]);
        if(isAdmin) {
            selectedUnitIdx = idx;
            document.getElementById('editPanel').style.display = 'block';
            document.getElementById('editName').value = target.units[idx];
            document.getElementById('editPdf').value = target.links[idx];
            document.getElementById('editVid').value = target.vids ? target.vids[idx] : "";
            document.getElementById('editPanel').scrollIntoView({ behavior: 'smooth' });
        } else { openFile(target.links[idx], target.units[idx]); }
    };

    window.shareUnit = (idx) => {
        const shareUrl = `${window.location.origin}${window.location.pathname}?path=${encodeURIComponent(path.join(','))}&unit=${idx}`;
        navigator.clipboard.writeText(shareUrl);
        showToast("Link Copied!");
    };

    window.openFile = (url, name) => {
        if(!url || url === "#") return;
        if(v2) {
            document.getElementById('v2-loader').style.display='flex';
            setTimeout(() => { document.getElementById('v2-loader').style.display='none'; launchViewer(url, name); }, 1500);
        } else launchViewer(url, name);
    };

    function launchViewer(url, name) {
        let embed = url;
        if(url.includes('drive.google.com')) embed = url.replace('/view', '/preview').split('?')[0];
        document.getElementById('v-name').innerText = name;
        document.getElementById('v-frame').src = embed;
        document.getElementById('v-dl').onclick = () => window.open(url, '_blank');
        document.getElementById('viewer').style.display = 'flex';
    }

    // YOUTUBE PLAYER FIX
    window.playVideo = (idx) => {
        let target = core; path.forEach(p => target = target[p]);
        let url = target.vids[idx];
        let vidId = "";
        try {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            vidId = (match && match[2].length == 11) ? match[2] : "";
        } catch(e) {}
        if(!vidId) { showToast("Invalid Video Link"); return; }
        
        // Finalized embed link with parameters to avoid 153 error
        document.getElementById('video-frame').src = `https://www.youtube.com/embed/${vidId}?autoplay=1&rel=0&enablejsapi=1`;
        document.getElementById('video-viewer').style.display = 'flex';
    };

    window.saveEdit = async () => {
        let target = core; path.forEach(p => target = target[p]);
        target.units[selectedUnitIdx] = document.getElementById('editName').value;
        target.links[selectedUnitIdx] = document.getElementById('editPdf').value;
        if(!target.vids) target.vids = [];
        target.vids[selectedUnitIdx] = document.getElementById('editVid').value;
        await setDoc(docRef, core);
        document.getElementById('editPanel').style.display='none';
        showToast("Changes Saved!");
    };

    window.renameNode = async (oldKey) => {
        let newKey = prompt("Enter New Name:", oldKey);
        if(!newKey || newKey === oldKey) return;
        let ref = core; path.forEach(p => ref = ref[p]);
        ref[newKey] = ref[oldKey];
        delete ref[oldKey];
        await setDoc(docRef, core);
        showToast("Renamed!");
    };

    window.addNewNode = async () => {
        const n = prompt("Name:"); if(!n) return;
        let ref = core; path.forEach(p => ref = ref[p]);
        if(path.length === 2) ref[n] = { _type:'subject', units:[], links:[], vids:[] };
        else ref[n] = {};
        await setDoc(docRef, core);
    };

    window.addUnitPrompt = async () => {
        let ref = core; path.forEach(p => ref = ref[p]);
        ref.units.push("New Unit"); ref.links.push("#"); if(!ref.vids) ref.vids=[]; ref.vids.push("");
        await setDoc(docRef, core);
    };

    window.deleteNode = async (k) => { if(confirm("Delete?")) { let ref = core; path.forEach(p => ref = ref[p]); delete ref[k]; await setDoc(docRef, core); }};
    window.deleteUnit = async () => { if(confirm("Delete?")) { let ref = core; path.forEach(p => ref = ref[p]); ref.units.splice(selectedUnitIdx, 1); ref.links.splice(selectedUnitIdx, 1); ref.vids.splice(selectedUnitIdx,1); await setDoc(docRef, core); document.getElementById('editPanel').style.display='none'; }};

    window.toggleV2 = async () => { v2 = !v2; if(!core._config) core._config={}; core._config.v2 = v2; await setDoc(docRef, core); };
    function updateV2UI() { const btn = document.getElementById('v2-toggle'); btn.innerText = v2 ? "V2: ON" : "V2: OFF"; btn.style.background = v2 ? "var(--neon)" : "#f39c12"; }

    window.moveIn = (k) => { path.push(k); render(); };
    window.goBack = () => { path.pop(); render(); };
    window.resetPath = () => { path = []; render(); };
    window.jumpTo = (idx) => { path = path.slice(0, idx+1); render(); };
    window.closeViewer = () => { document.getElementById('viewer').style.display='none'; document.getElementById('v-frame').src=''; };
    window.closeVideo = () => { document.getElementById('video-viewer').style.display='none'; document.getElementById('video-frame').src=''; };

    let fCount = 0;
    document.getElementById('adminTrigger').onclick = () => {
        if(++fCount === 5) {
            if(prompt("Pass:") === "useas77") { isAdmin = true; document.getElementById('admin-bar').style.display='block'; render(); }
            fCount = 0;
        }
    };

    window.showToast = (m) => {
        const t = document.createElement('div'); t.className='toast'; t.innerText=m;
        document.getElementById('toast-container').appendChild(t);
        setTimeout(() => t.remove(), 3000);
    };
</script>
</body>
</html>
