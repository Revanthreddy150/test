<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thodu - Real-time Journey</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Poppins:wght@400;500;600&display=swap');

        :root {
            --primary: #28a745;
            --dark: #1a1a1a;
            --gray: #6c757d;
            --light-bg: #f8f9fa;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: 'Poppins', sans-serif;
            background-color: #ffffff;
            overflow: hidden;
        }

        .screen {
            display: none;
            width: 100%; height: 100vh;
            position: absolute; top: 0; left: 0;
            flex-direction: column; justify-content: center; align-items: center;
        }
        .active { display: flex; }

        /* --- SPLASH --- */
        .brand-name { display: flex; font-size: 5rem; font-weight: 900; color: var(--dark); transition: 0.7s; }
        .letter { display: inline-block; opacity: 0; }
        .t { animation: fL 0.8s forwards 0.8s; } .h { animation: fB 0.8s forwards 1.0s; } .o { animation: zI 0.8s forwards 1.2s; } .d { animation: flI 0.5s forwards 1.4s; } .u { animation: fR 0.8s forwards 1.6s; }
        @keyframes fL { from { opacity: 0; transform: translateX(-80px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes fB { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes zI { from { opacity: 0; transform: scale(0.3); } to { opacity: 1; transform: scale(1); } }
        @keyframes flI { 0% { opacity: 0; } 100% { opacity: 1; } }
        @keyframes fR { from { opacity: 0; transform: translateX(80px); } to { opacity: 1; transform: translateX(0); } }
        .finished-green { color: var(--primary) !important; transform: scale(1.05); }

        /* --- AUTH CARD --- */
        .auth-card {
            width: 88%; max-width: 400px;
            padding: 35px; background: white;
            border-radius: 28px; box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
        }
        .input-box { width: 100%; margin-bottom: 15px; text-align: left; }
        input {
            width: 100%; padding: 14px; border: 2px solid #f0f0f0; 
            border-radius: 14px; font-family: 'Poppins'; box-sizing: border-box; outline: none;
        }
        input:focus { border-color: var(--primary); }
        .btn {
            width: 100%; padding: 15px; border: none; border-radius: 14px;
            font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-primary { background: var(--primary); color: white; }

        /* --- DASHBOARD --- */
        #home-screen { justify-content: flex-start; background: var(--light-bg); }
        .content-area { flex: 1; width: 100%; padding: 20px; overflow-y: auto; padding-bottom: 100px; }
        
        .location-bar {
            background: white; padding: 15px 20px; border-radius: 15px;
            display: flex; align-items: center; gap: 12px;
            font-size: 0.9rem; color: var(--dark);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px;
            border: 1px solid #eee;
        }

        .location-icon { font-size: 1.2rem; }
        #user-loc-text { font-weight: 500; color: var(--dark); }

        .ride-card {
            background: white; padding: 20px; border-radius: 16px;
            margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border-left: 6px solid var(--primary);
        }

        .bottom-nav { 
            width: 100%; height: 75px; background: white; 
            border-top: 1px solid #eee; display: flex; 
            position: fixed; bottom: 0; left: 0; z-index: 100;
        }
        .nav-item { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #ccc; cursor: pointer; font-size: 0.8rem; }
        .nav-active { color: var(--primary); font-weight: 600; }
    </style>
</head>
<body>

    <div id="splash-screen" class="screen active">
        <div id="main-text" class="brand-name">
            <span class="letter t">T</span><span class="letter h">H</span><span class="letter o">O</span><span class="letter d">D</span><span class="letter u">U</span>
        </div>
        <p id="tagline" style="margin-top:15px; color:#666;"></p>
    </div>

    <div id="login-screen" class="screen">
        <div class="auth-card" id="auth-container"></div>
    </div>

    <div id="home-screen" class="screen">
        <div id="content" class="content-area"></div>
        <nav class="bottom-nav">
            <div class="nav-item nav-active" id="nav-rides" onclick="switchTab('rides', this)"><span>🚗</span><span>Rides</span></div>
            <div class="nav-item" id="nav-profile" onclick="switchTab('profile', this)"><span>👤</span><span>Profile</span></div>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, 
            sendEmailVerification, updateProfile, onAuthStateChanged, signOut, reload 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA1QeDf1E_Kb1ZC15ahw1dY8hk3J0gXopY",
            authDomain: "thodu-65cb9.firebaseapp.com",
            projectId: "thodu-65cb9",
            storageBucket: "thodu-65cb9.firebasestorage.app",
            messagingSenderId: "1070229943496",
            appId: "1:1070229943496:web:038e2e74c463e7acefa1fd"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        let checkInterval = null;

        // --- NEW REVERSE GEOCODING LOGIC ---
        async function getAreaName(lat, lon) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                const data = await response.json();
                // Pick the best name from the address object
                const address = data.address;
                const area = address.suburb || address.town || address.village || address.city || "Unknown Location";
                const road = address.road ? address.road + ", " : "";
                return `${road}${area}`;
            } catch (e) {
                return `Lat: ${lat}, Lon: ${lon}`;
            }
        }

        window.getMyLocation = () => {
            const locText = document.getElementById('user-loc-text');
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    locText.innerText = "Finding area name...";
                    const areaName = await getAreaName(lat, lon);
                    locText.innerText = areaName;
                }, (err) => {
                    locText.innerText = "Location permission denied";
                });
            }
        };

        // --- AUTH & NAVIGATION (Previous Logic Kept Perfect) ---
        window.setAuthState = (state) => {
            clearInterval(checkInterval);
            const container = document.getElementById('auth-container');
            if (state === 'login') {
                container.innerHTML = `<h2>Login</h2><div class="input-box"><input type="email" id="email" placeholder="Email"></div><div class="input-box"><input type="password" id="password" placeholder="Password"></div><button class="btn btn-primary" id="btn-login">Login</button><p style="margin-top:20px;">New? <span style="color:var(--primary); cursor:pointer;" onclick="setAuthState('signup')">Sign Up</span></p>`;
            } else if (state === 'signup') {
                container.innerHTML = `<h2>Sign Up</h2><div class="input-box"><input type="text" id="name" placeholder="Name"></div><div class="input-box"><input type="email" id="email" placeholder="Email"></div><div class="input-box"><input type="password" id="password" placeholder="Password"></div><button class="btn btn-primary" id="btn-signup">Create Account</button><p style="margin-top:20px;"><span style="color:var(--primary); cursor:pointer;" onclick="setAuthState('login')">Back to Login</span></p>`;
            } else if (state === 'verify-waiting') {
                container.innerHTML = `<div class="status-badge status-pending">WAITING FOR VERIFICATION</div><h3>Verify Email</h3><p>Check your inbox to enter Thodu.</p><button class="btn" onclick="window.handleLogout()" style="background:#eee;">Cancel</button>`;
                checkInterval = setInterval(async () => { if(auth.currentUser){ await reload(auth.currentUser); if(auth.currentUser.emailVerified){ clearInterval(checkInterval); location.reload(); } } }, 3000);
            }
            if(document.getElementById('btn-login')) document.getElementById('btn-login').onclick = login;
            if(document.getElementById('btn-signup')) document.getElementById('btn-signup').onclick = signup;
        };

        async function signup() {
            try {
                const cred = await createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
                await updateProfile(cred.user, { displayName: document.getElementById('name').value });
                await sendEmailVerification(cred.user);
                setAuthState('verify-waiting');
            } catch (e) { alert(e.message); }
        }

        async function login() {
            try {
                const cred = await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
                if (!cred.user.emailVerified) setAuthState('verify-waiting');
            } catch (e) { alert(e.message); }
        }

        window.handleLogout = async () => { await signOut(auth); location.reload(); };

        window.switchTab = (tab, el) => {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('nav-active'));
            el.classList.add('nav-active');
            const cont = document.getElementById('content');
            if(tab === 'rides') {
                cont.innerHTML = `<div class="location-bar"><span class="location-icon">📍</span><span id="user-loc-text">Fetching your area...</span></div><h2 style="font-family:'Montserrat';">Nearby Rides</h2><div class="ride-card"><b>Express Cab</b><br><small>4.9 ★ • Available Now</small></div>`;
                window.getMyLocation();
            } else {
                cont.innerHTML = `<div style="text-align:center; padding-top:40px;"><img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" style="width:80px; border-radius:50%;"><h3>${auth.currentUser?.displayName}</h3><p>Verified Thodu Member</p><br><button onclick="window.handleLogout()" style="color:red; background:none; border:none; cursor:pointer; font-weight:600;">Logout</button></div>`;
            }
        };

        setAuthState('login');
        setTimeout(() => document.getElementById('main-text').classList.add('finished-green'), 2500);
        setTimeout(() => document.getElementById('tagline').innerText = "mee prayanam maa bhadyatha", 3000);
        setTimeout(() => { onAuthStateChanged(auth, (user) => { if (user && user.emailVerified) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById('home-screen').classList.add('active'); switchTab('rides', document.getElementById('nav-rides')); } else if (!user) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById('login-screen').classList.add('active'); } }); }, 6000);
    </script>
</body>
</html>
