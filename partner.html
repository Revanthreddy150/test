<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QHP Partner Console</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-950 font-sans min-h-screen text-slate-100">

    <div id="auth-container" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-slate-800 border border-slate-700 p-8 rounded-3xl shadow-2xl w-full max-w-md">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-black text-blue-400">QHP Partner Network</h2>
                <p class="text-xs text-slate-400 mt-1 uppercase tracking-wider font-bold">Agent Access Node</p>
            </div>

            <div id="login-section">
                <div class="mb-4">
                    <label class="block text-slate-400 text-xs font-bold uppercase mb-2">Email or Phone</label>
                    <input type="text" id="login-identifier" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white" placeholder="Enter credentials">
                </div>
                <div class="mb-5">
                    <label class="block text-slate-400 text-xs font-bold uppercase mb-2">Password</label>
                    <input type="password" id="login-password" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white" placeholder="••••••••">
                </div>
                <button id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition cursor-pointer">Login as Agent</button>
                <button id="go-to-register" class="w-full text-center text-xs text-slate-400 font-medium hover:underline mt-5 block cursor-pointer">New Agent Registration</button>
            </div>

            <div id="register-section" class="hidden space-y-4">
                <h3 class="text-sm font-bold text-slate-300 uppercase">Submit Onboarding Credentials</h3>
                <div><input type="text" id="reg-name" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white" placeholder="Full Name"></div>
                <div><input type="number" id="reg-age" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white" placeholder="Age"></div>
                <div><input type="text" id="reg-email" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white" placeholder="Email Address"></div>
                <div><input type="tel" id="reg-phone" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white" placeholder="Phone Number"></div>
                <div><input type="text" id="reg-aadhar" maxlength="12" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white" placeholder="12 Digit Aadhaar Number"></div>
                <div><input type="text" id="reg-pan" maxlength="10" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white uppercase" placeholder="PAN Card Number"></div>
                <div><input type="text" id="reg-dl" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white uppercase" placeholder="Driving Licence (DL)"></div>
                <button id="btn-submit-application" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs uppercase cursor-pointer">Submit Application</button>
                <button id="back-to-login" class="w-full text-center text-xs text-slate-500 hover:underline mt-2 block cursor-pointer">Back to Login</button>
            </div>

            <div id="waiting-section" class="hidden text-center py-6">
                <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                <h3 class="text-base font-bold text-white mb-2">Onboarding Verification Link Dispatched</h3>
            </div>

            <div id="password-setup-section" class="hidden space-y-4">
                <h3 class="text-base font-bold text-emerald-400 text-center">Identity Verified!</h3>
                <div><input type="password" id="setup-password" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white" placeholder="Choose Password (min 6 chars)"></div>
                <button id="btn-complete-setup" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs cursor-pointer">Finalize Password</button>
            </div>
        </div>
    </div>

    <div id="home-container" class="hidden min-h-screen flex flex-col bg-slate-950">
        <nav class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center relative">
            <div class="flex items-center space-x-2 bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800 shadow-inner">
                <span id="geo-dot" class="w-2 h-2 rounded-full bg-amber-500"></span>
                <span id="geo-location-display" class="text-xs font-mono font-bold text-slate-400">Locking Agent GPS...</span>
            </div>
            <h1 class="text-lg font-black text-blue-400 absolute left-1/2 transform -translate-x-1/2">QHP Agent Hub</h1>
            <div class="flex items-center space-x-3">
                <span id="partner-status-badge" class="text-[9px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">Unverified</span>
                <button id="btn-logout" class="bg-slate-800 hover:bg-red-950 text-slate-300 px-3 py-1.5 border border-slate-700 text-xs font-bold rounded-xl cursor-pointer">Sign Out</button>
            </div>
        </nav>

        <main class="flex-grow p-6 grid grid-cols-1 lg:grid-cols-2 gap-6 overflow-y-auto max-h-[88vh]">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 border-b border-slate-800 pb-2">🆘 Assistance Requests (20 KM)</h3>
                <div id="agent-helps-feed" class="space-y-3 overflow-y-auto flex-1 content-start"></div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 border-b border-slate-800 pb-2">📦 Delivery Orders (20 KM COD)</h3>
                <div id="agent-orders-feed" class="space-y-3 overflow-y-auto flex-1 content-start"></div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, child, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // FIXED: Using the requested new config string parameters for agent identity authorizations
        const partnerFirebaseConfig = {
            apiKey: "AIzaSyA1QeDf1E_Kb1ZC15ahw1dY8hk3J0gXopY",
            authDomain: "thodu-65cb9.firebaseapp.com",
            databaseURL: "https://thodu-65cb9-default-rtdb.firebaseio.com",
            projectId: "thodu-65cb9",
            storageBucket: "thodu-65cb9.firebasestorage.app",
            messagingSenderId: "1070229943496",
            appId: "1:1070229943496:web:038e2e74c463e7acefa1fd",
            measurementId: "G-NF17LPGHWV"
        };

        // Old config parameter references used exclusively to capture customer feeds pipelines cross-project
        const userFirebaseConfig = {
            apiKey: "AIzaSyDGI7b17RRfpgctXIVIgPtyECtUBLEcMAU",
            databaseURL: "https://skill-bc495-default-rtdb.firebaseio.com",
        };

        const partnerApp = initializeApp(partnerFirebaseConfig, "partnerProject");
        const userApp = initializeApp(userFirebaseConfig, "userProject");

        const partnerAuth = getAuth(partnerApp);
        const partnerDb = getDatabase(partnerApp);
        const userDb = getDatabase(userApp);

        let verificationLoopWorker = null, partnerLat = null, partnerLng = null, partnerAadharVerifiedState = "Unverified", activeAgentName = "", activeAgentPhone = "";

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('go-to-register').addEventListener('click', () => showView('register'));
            document.getElementById('back-to-login').addEventListener('click', () => showView('login'));
            document.getElementById('btn-submit-application').addEventListener('click', executePartnerRegistrationStepOne);
            document.getElementById('btn-complete-setup').addEventListener('click', completePartnerPasswordSetup);
            document.getElementById('btn-login').addEventListener('click', executePartnerLogin);
            document.getElementById('btn-logout').addEventListener('click', () => signOut(partnerAuth));
        });

        function showView(view) {
            document.getElementById('auth-container').classList.add('hidden'); document.getElementById('home-container').classList.add('hidden');
            document.getElementById('login-section').classList.add('hidden'); document.getElementById('register-section').classList.add('hidden');
            document.getElementById('waiting-section').classList.add('hidden'); document.getElementById('password-setup-section').classList.add('hidden');
            if (view === 'home') { document.getElementById('home-container').classList.remove('hidden'); triggerAgentGPSHardwareTrack(); }
            else { document.getElementById('auth-container').classList.remove('hidden'); document.getElementById(view + '-section').classList.remove('hidden'); }
        }

        onAuthStateChanged(partnerAuth, (user) => {
            if (user) {
                if (user.emailVerified) {
                    clearInterval(verificationLoopWorker);
                    onValue(ref(partnerDb, `partners/${user.uid}`), (snap) => {
                        if (snap.exists()) {
                            const data = snap.val(); if (!data.passwordConfigured) { showView('password-setup'); return; }
                            partnerAadharVerifiedState = data.verificationStatus || "Unverified";
                            activeAgentName = data.name || "Agent"; activeAgentPhone = data.phone || "N/A";
                            
                            const badge = document.getElementById('partner-status-badge'); badge.innerText = `Agent: ${partnerAadharVerifiedState}`;
                            showView('home');
                        }
                    });
                } else { showView('waiting'); startVerificationLoopTracker(user); }
            } else { showView('login'); }
        });

        function getDistanceHaversine(lat1, lon1, lat2, lon2) {
            const R = 6371; const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        function triggerAgentGPSHardwareTrack() {
            navigator.geolocation.watchPosition((pos) => {
                partnerLat = pos.coords.latitude; partnerLng = pos.coords.longitude;
                document.getElementById('geo-location-display').innerText = `Locked: ${partnerLat.toFixed(4)}, ${partnerLng.toFixed(4)}`;
                sync20KmRadiusLiveFeeds();
            }, null, { enableHighAccuracy: true });
        }

        function sync20KmRadiusLiveFeeds() {
            if (!partnerLat || !partnerLng) return;

            // FIXED: Pulling feeds cross-project from userDb reference node paths
            onValue(ref(userDb, 'helps_posts'), (snap) => {
                const feed = document.getElementById('agent-helps-feed'); feed.innerHTML = "";
                if (!snap.exists()) { feed.innerHTML = `<p class="text-xs text-slate-500 p-4">No requests active.</p>`; return; }
                Object.values(snapshot.val()).forEach(p => {
                    const dist = getDistanceHaversine(partnerLat, partnerLng, p.lat, p.lng); if (dist > 20) return;
                    const div = document.createElement('div'); div.className = "p-4 bg-slate-900 border border-slate-800 rounded-xl space-y-2 text-xs";
                    // FIXED: Map links and working numbers now explicitly visible to localized partners
                    div.innerHTML = `
                        <div class="flex justify-between items-center"><span class="font-bold text-white text-sm">${p.posterName}</span><span class="text-slate-500">${dist.toFixed(1)} km</span></div>
                        <p class="text-slate-400">${p.desc}</p>
                        <div class="flex justify-between items-center text-[11px] text-slate-500 mt-2 font-mono">
                            <span>📞 Phone Contact: ${p.phone}</span>
                            <button class="bg-slate-800 hover:bg-slate-700 px-2 py-0.5 rounded text-white btn-maps-link" data-lat="${p.lat}" data-lng="${p.lng}">📍 View Customer Map</button>
                        </div>
                        <button class="w-full mt-3 bg-blue-600 text-white font-bold py-2 rounded-xl btn-accept-job" data-uid="${p.uid}" data-pid="helps" data-key="${p.postId}">Accept Help Assignment</button>
                    `;
                    feed.appendChild(div);
                });
                bindAcceptJobControlButtons();
            });

            onValue(ref(userDb, 'orders'), (snap) => {
                const feed = document.getElementById('agent-orders-feed'); feed.innerHTML = "";
                if (!snap.exists()) { feed.innerHTML = `<p class="text-xs text-slate-500 p-4">No delivery orders active.</p>`; return; }
                Object.values(snap.val()).forEach(o => {
                    const dist = getDistanceHaversine(partnerLat, partnerLng, o.lat, o.lng); if (dist > 20 || o.status !== "Processing") return;
                    const itemsText = o.items.map(i => `${i.title} (x${i.qty})`).join(', ');
                    const div = document.createElement('div'); div.className = "p-4 bg-slate-900 border border-slate-800 rounded-xl space-y-2 text-xs";
                    div.innerHTML = `
                        <div class="flex justify-between items-center"><span class="font-bold text-white text-sm">${o.shopName}</span><span class="text-amber-500 font-bold">${o.totalBill}</span></div>
                        <p class="text-slate-400"><b>Items:</b> ${itemsText}</p>
                        <p class="text-slate-500"><b>Address Book Destination:</b> ${o.deliveryAddress}</p>
                        <div class="flex justify-between items-center text-[11px] text-slate-500 font-mono mt-2">
                            <span>📞 Customer Number: ${o.userPhone || 'N/A'}</span>
                            <button class="bg-slate-800 px-2 py-0.5 rounded text-white btn-maps-link" data-lat="${o.lat}" data-lng="${o.lng}">📍 Route Map</button>
                        </div>
                        <button class="w-full mt-3 bg-emerald-600 text-white font-bold py-2 rounded-xl btn-accept-job" data-uid="${o.uid}" data-pid="orders" data-key="${o.orderId}">Accept COD Delivery</button>
                    `;
                    feed.appendChild(div);
                });
                bindAcceptJobControlButtons();
            });
        }

        function bindAcceptJobControlButtons() {
            document.querySelectorAll('.btn-maps-link').forEach(b => b.addEventListener('click', (e) => {
                window.open(`https://www.google.com/maps/search/?api=1&query=${b.getAttribute('data-lat')},${b.getAttribute('data-lng')}`, '_blank');
            }));

            document.querySelectorAll('.btn-accept-job').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (partnerAadharVerifiedState !== "Verified") { alert("Account unverified by admin control rules."); return; }
                    const userUidKey = btn.getAttribute('data-uid'); const parentId = btn.getAttribute('data-pid'); const objectKey = btn.getAttribute('data-key');
                    try {
                        const notiPushRef = push(ref(userDb, `notifications/${userUidKey}`));
                        await set(notiPushRef, { title: "Order Confirmed!", body: `Agent ${activeAgentName} (Ph: ${activeAgentPhone}) accepted your request.`, timestamp: Date.now() });

                        if (parentId === 'helps') { await remove(ref(userDb, `helps_posts/${objectKey}`)); }
                        else { await update(ref(userDb, `orders/${objectKey}`), { status: "Approved", agentName: activeAgentName, agentPhone: activeAgentPhone }); }
                        alert("Job accepted successfully!");
                    } catch(err) { alert(err.message); }
                });
            });
        }

        async function executePartnerRegistrationStepOne() {
            const email = document.getElementById('reg-email').value.trim(); const phone = document.getElementById('reg-phone').value.trim();
            const name = document.getElementById('reg-name').value.trim(); const age = document.getElementById('reg-age').value.trim();
            const aadh = document.getElementById('reg-aadhar').value.trim(); const pan = document.getElementById('reg-pan').value.trim();
            const dl = document.getElementById('reg-dl').value.trim();
            if (!email || !phone || !name || aadh.length !== 12) return alert("Verify mandatory documents input parameters.");

            try {
                const res = await createUserWithEmailAndPassword(partnerAuth, email, "TEMP_SEED_" + Math.random().toString(36).substring(2, 9));
                await set(ref(partnerDb, 'partner_verification_requests/' + res.user.uid), { uid: res.user.uid, email, name, phone, age, aadhar: aadh, pan, drivingLicence: dl, submittedAt: Date.now() });
                await set(ref(partnerDb, 'partners/' + res.user.uid), { uid: res.user.uid, email, name, phone, verificationStatus: "Pending", passwordConfigured: false });
                await sendEmailVerification(res.user); showView('waiting');
            } catch(e) { alert(e.message); }
        }

        async function completePartnerPasswordSetup() {
            const pass = document.getElementById('setup-password').value.trim(); if (pass.length < 6) return alert("Min 6 chars.");
            try {
                await update(ref(partnerDb, `partners/${partnerAuth.currentUser.uid}`), { passwordConfigured: true, verificationStatus: "Pending" });
                window.location.reload();
            } catch(e) { alert(e.message); }
        }

        async function executePartnerLogin() {
            try { await signInWithEmailAndPassword(partnerAuth, document.getElementById('login-identifier').value.trim(), document.getElementById('login-password').value.trim()); } catch(e) { alert(e.message); }
        }

        function startVerificationLoopTracker(user) {
            clearInterval(verificationLoopWorker);
            verificationLoopWorker = setInterval(async () => { await user.reload(); if (user.emailVerified) { clearInterval(verificationLoopWorker); window.location.reload(); } }, 3000);
        }
    </script>
</body>
</html>
